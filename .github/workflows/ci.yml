name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Сборка, линтинг и тестирование
    runs-on: ubuntu-latest

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Установка Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Проверка синтаксиса и стиля (flake8)
      run: |
        # Останов с ошибкой при критических синтаксических сбоях
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Предупреждения по длине строк и сложности
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Запуск модульных тестов (pytest)
      run: |
        pytest -v

    - name: Проверка безопасности (bandit)
      run: |
        bandit -r . -x ./tests,./test_*.py